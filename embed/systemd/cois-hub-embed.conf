# CoiOS embeds through baro-embed.service (bge-small-en-v1.5, 512 tokens) on :8081.
# 2000 chars is about 512 English tokens; the server cuts at 512 tokens itself, so a denser chunk is truncated, not refused.
[Service]
Environment=COIOS_EMBED_MODEL=bge-small-en-v1.5
Environment=COIOS_EMBED_MAX_CHARS=2000
