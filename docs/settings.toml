summary = "Drop tokens below this fraction of the top token probability."
help = """Min-p truncation, applied at temperature > 0. Omitted: BARO_DEFAULT_MIN_P, else untruncated. The turbo27b-coder profile uses 0. Effect on answer quality: unmeasured."""

