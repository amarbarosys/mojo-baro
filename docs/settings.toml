# docs/settings.toml: the single source for every setting mojo-baro reads (lane F3, 2026-11-12).
# Checked against the code by tools/settings-check.mojo (wired into tools/ci-checks.sh); the README
# "Configuration" table is generated from it (tools/settings-check --readme). Face tabs (F4) read it.
#
# key     env knob (BARO_*, set in the environment, a profile [env] or -D at build) or a request field "sampling.NAME".
# group   sampling | engine | model | front
# type    int | float | bool | enum | path | string. An absent `default` means unset (the code has no default).
# restart true = engine restart needed (build flags: a rebuild + restart); sampling request fields never need one.
# level   basic | advanced (the face hides advanced behind a toggle). status: stable | experimental | bench-only.
# kind    env (engine, read at run time) | build (-D flag) | server-env (baro-serve) | shell (tools/baro) | request (a request field).
# models  qwen35 (dense) | qwen35moe | spark | all. sources: files the code reads it in (first 6).
# Help facts come from code, docs and receipts; a claim without a source says "unmeasured".

[[setting]]
key = "sampling.temperature"
group = "sampling"
label = "Temperature"
type = "float"
kind = "request"
default = 0.0
min = 0.0
max = 2.0
restart = false
level = "basic"
status = "stable"
models = ["qwen35", "qwen35moe", "spark"]
sources = ["serve/src/main.rs", "serve/front/api.mojo", "serve/PROTOCOL.md"]
summary = "Randomness of the draw; 0 = greedy, and greedy when omitted."
help = """Sampling randomness. 0 is greedy and what baro-serve does when the field is omitted (docs/plan-ailab-server.md). Above 0 the device sampler (kernels/sample.mojo, amar_sample_row) draws inside the decode loop, composed with speculation. Qwen3 thinking-mode use is 0.6 (profiles/turbo27b-coder.toml, set client-side). Spark engines parse it and still decode greedy (serve/PROTOCOL.md). Effect on answer quality: unmeasured."""

[[setting]]
key = "sampling.top_p"
group = "sampling"
label = "Top-p"
type = "float"
kind = "request"
min = 0.0
max = 1.0
restart = false
level = "basic"
status = "stable"
models = ["qwen35", "qwen35moe", "spark"]
sources = ["serve/src/main.rs", "serve/front/api.mojo", "serve/PROTOCOL.md"]
summary = "Keep the smallest token set whose probability sums to p."
help = """Nucleus truncation, applied at temperature > 0. Omitted: baro-serve falls back to BARO_DEFAULT_TOP_P, else untruncated. llama-server defaults are 40 / 0.95 / 0.05 for top-k / top-p / min-p. The turbo27b-coder profile uses 0.95. Effect on answer quality: unmeasured."""

