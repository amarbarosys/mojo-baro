sources = ["serve/src/main.rs", "serve/front/api.mojo", "serve/PROTOCOL.md"]
summary = "Sample only from the k most likely tokens."
help = """Top-k truncation, applied at temperature > 0. Omitted: BARO_DEFAULT_TOP_K, else untruncated. The turbo27b-coder profile uses 20. Effect on answer quality: unmeasured."""

