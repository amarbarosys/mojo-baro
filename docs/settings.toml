status = "stable"
models = ["qwen35", "qwen35moe", "spark"]
sources = ["serve/src/main.rs", "serve/front/api.mojo", "serve/PROTOCOL.md"]
summary = "Most tokens one answer may generate."
help = """Answer length cap. The 16K floor (CLAUDE.md, bench/min16k.sh) is the minimum the face allows. Omitted on the wire: up to the window, TMAX minus prompt (serve/PROTOCOL.md, serve/src/main.rs fit_n). The face sends this value. Cost: decode time grows with tokens generated."""

