group = "engine"
label = "Context window"
type = "int"
kind = "env"
default = 16384
min = 16384
max = 262144
restart = true
level = "basic"
status = "stable"
models = ["qwen35", "qwen35moe"]
sources = ["cpu/engine_cpu.mojo", "serve/engine.mojo", "serve/front/main.mojo", "serve/front/stub_engine.mojo", "serve/src/main.rs", "serve/src/state.rs"]
summary = "Context window the KV pool is sized for, in tokens (engine default 1088, baro-serve 32768, face default 16384)."
help = """Longest prompt plus answer the engine keeps, in tokens: the KV pool is sized for it at start, so a change needs an engine restart. Engine default is 1088 and baro-serve passes 32768; the face default is the 16K floor (CLAUDE.md, bench/min16k.sh refuses less). Cost: VRAM per token per sequence (MoE f32 KV 40,960 bytes). Size it against FREE VRAM, desktop included: read rocm-smi, then run `pack-fit PACK --tmax N --used-gb <measured>`; BARO_KVQ=int8 halves the KV part. The 262144 ceiling is the plan's contract value; the real limit is VRAM. A pack that no longer fits spills to GTT and decode drops about 10x with no log line (README Troubleshooting). Context length the KV pool is sized for, in tokens (MoE f32 KV costs 40,960 bytes per token per sequence)."""

