[[preset]]
name = "Fast"
group = "speed"
summary = "Speculative decode on, smallest window (16K floor), greedy. Speed gain beyond BARO_SPEC 1.104x unmeasured."
values = { BARO_SPEC = true, BARO_SPEC_K = 2, BARO_MEGA = true, BARO_PREFILL = true, BARO_TMAX = 16384, "sampling.temperature" = 0.0 }

[[preset]]
name = "Balanced"
group = "speed"
summary = "Startup default (owner 2026-11-12): speculative decode k=2, f32 KV (the face falls back to int8 when it does not fit), 32K window, temperature 0.7, top-p 0.9."
values = { BARO_SPEC = true, BARO_SPEC_K = 2, BARO_KVQ = "f32", BARO_MEGA = true, BARO_PREFILL = true, BARO_TMAX = 32768, "sampling.temperature" = 0.7, "sampling.top_p" = 0.9 }

[[preset]]
name = "Quality"
group = "speed"
summary = "Exact path: no speculation, f32 KV, 32768 window (baro-serve default), greedy. Quality gain unmeasured."
values = { BARO_SPEC = false, BARO_KVQ = "f32", BARO_TMAX = 32768, "sampling.temperature" = 0.0 }

[[preset]]
name = "Chat"
group = "task"
summary = "Light sampling for conversation. Values are a convention, unmeasured."
values = { "sampling.temperature" = 0.7, "sampling.top_p" = 0.9, "sampling.max_tokens" = 16000 }

[[preset]]
name = "Code"
group = "task"
summary = "Low temperature for code edits. Values are a convention, unmeasured."
values = { "sampling.temperature" = 0.2, "sampling.top_p" = 0.95, "sampling.max_tokens" = 16000 }

[[preset]]
name = "Reasoning"
group = "task"
summary = "Thinking on, max_tokens 16000, Qwen3 thinking-mode sampling from profiles/turbo27b-coder.toml (0.6 / 0.95 / 20 / 0). The chat folds the thinking block."
values = { "sampling.temperature" = 0.6, "sampling.top_p" = 0.95, "sampling.top_k" = 20, "sampling.min_p" = 0.0, "sampling.max_tokens" = 16000, "chat_template_kwargs.enable_thinking" = true }

[[preset]]
name = "Low VRAM"
group = "fit"
summary = "int8 KV (halves KV memory, dense) and the 16K floor window. Check with pack-fit before applying."
values = { BARO_KVQ = "int8", BARO_TMAX = 16384 }

[[preset]]
name = "Long context"
group = "fit"
summary = "int8 KV and a 131072 window, as profiles/turbo27b-coder.toml (pack-fit 2026-11-10: fits at 2.0 GB desktop; int8 speed at this window unmeasured)."
values = { BARO_KVQ = "int8", BARO_TMAX = 131072, BARO_SPEC = true, BARO_MEGA = true }
