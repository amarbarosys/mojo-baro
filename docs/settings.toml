summary = "Let the model think before it answers; the chat shows the thinking block folded."
help = """Sent as chat_template_kwargs.enable_thinking on chat requests; on by default (serve/src/main.rs). Cost: the thinking tokens count against max_tokens and the window, so a thinking answer needs room (the Reasoning preset sets max_tokens 16000). With the grammar route, thinking is off (serve/PROTOCOL.md). Effect on answer quality: unmeasured."""

