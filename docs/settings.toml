# ---------------------------------------------------------------- presets
# group: speed | task | fit | user. values = { KEY = value }; user presets (~/.config/mojo-baro/presets.toml) share this shape.
# Every KEY must be a [[setting]] key (tools/settings-check checks it). Effects: only BARO_SPEC has a measured number
# (1.104x, README); the rest are conventions, marked "unmeasured" in each summary.

[[setting]]
key = "BARO_EMBED_MAX_TOKENS"
group = "front"
label = "BARO_EMBED_MAX_TOKENS"
type = "int"
kind = "server-env"
default = 512
restart = true
level = "advanced"
status = "stable"
models = ["all"]
sources = ["serve/src/embed.rs"]
summary = "Token cap per text for the standard embedder (/v1/embeddings, bge-small-en-v1.5), 3 to 512."
help = """baro-serve: token cap per embedded text, CLS and SEP included; longer texts are cut. 512 is the model's own limit (brain-ask cuts at 256, so texts over 255 tokens differ from its vectors). Read back from the embedder child's command line in bench/embed-gate.sh."""

