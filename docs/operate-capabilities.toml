# Capabilities of mojo-baro as an operator meets them: how to turn each on, the default, the best standard and its source.
# Read by tools/operate-audit.py (writes docs/OPERATE-AUDIT.md) and by tools/mcp/baro_mcp.mojo (tool `capabilities`).
# Settings themselves (every BARO_* knob, request field, flag) live in docs/settings.toml; `settings` names the keys of this row.
#
# id        short slug
# enable    what the operator does (flag / env / endpoint / request field)
# default   what happens when nothing is set
# best      the best standard and the measured reason (a claim without a source says "unmeasured")
# status    WORKS | PARTIAL | OFF | FAILS (word of docs/CAPABILITIES.md; OFF = default-off but works)
# gui       where the face (`tools/baro gui`) offers it, or MISSING
# check     the command or endpoint that reads the effect back
# source    file:line or doc the row stands on

[[capability]]
id = "chat"
name = "Chat completions (OpenAI shape)"
enable = "POST /v1/chat/completions, `stream: true` for SSE; any OpenAI client with base_url http://127.0.0.1:8080/v1; the Responses API adapter POST /v1/responses (serve/src/main.rs:531)"
default = "always on; greedy (temperature 0) when the field is omitted"
best = "Leave max_tokens at 16000 or more: the repo's floor for every run is a 16384 window and 16000 tokens, because lower caps cut the reasoning and void the result."
status = "WORKS"
gui = "Chat tab (send, stop, copy); stop drops the connection and the front cancels the run"
check = "response `timings` (tok/s, decode path, fail word); GET /health"
source = "README.md:304-340; bench/min16k.sh"
settings = ["sampling.max_tokens"]

[[capability]]
id = "completions"
name = "Raw completions and token-id prompts"
enable = "POST /v1/completions; `prompt` is text or a list of token ids"
default = "always on"
best = "Use token ids when the exact tokenisation matters (identity checks)."
status = "WORKS"
gui = "MISSING"
check = "POST /tokenize then compare ids"
source = "README.md:304-320"
settings = []

[[capability]]
id = "sampling"
name = "Device sampling"
enable = "request fields temperature, top_p, top_k, min_p, seed; server defaults BARO_DEFAULT_TOP_K/TOP_P/MIN_P"
default = "temperature 0 (greedy); top-k/top-p/min-p unset (untruncated)"
best = "Greedy for code and identity work; Qwen3 thinking mode uses 0.6 / 0.95 / 20 / 0 (profiles/turbo27b-coder.toml). Sampling runs on the GPU inside the decode loop and composes with speculation. Effect on answer quality: unmeasured."
status = "WORKS"
gui = "Sampling tab (temperature, top_p, top_k basic; min_p, seed advanced)"
check = "same seed twice gives the same ids; `timings.path`"
source = "README.md:322-326; docs/settings.toml sampling.*; profiles/turbo27b-coder.toml"
settings = ["sampling.temperature", "sampling.top_p", "sampling.top_k", "sampling.min_p", "sampling.seed", "BARO_DEFAULT_TOP_K", "BARO_DEFAULT_TOP_P", "BARO_DEFAULT_MIN_P"]

[[capability]]
id = "penalties"
name = "presence_penalty / frequency_penalty"
enable = "request fields"
default = "ignored"
best = "Do not rely on them: the front parses and carries them and does not act on them."
status = "PARTIAL"
gui = "Sampling tab, Advanced (shown, but has no effect)"
check = "none: the field changes nothing"
source = "docs/settings.toml sampling.presence_penalty, sampling.frequency_penalty"
settings = ["sampling.presence_penalty", "sampling.frequency_penalty"]

[[capability]]
id = "thinking"
name = "Thinking mode"
enable = "request field chat_template_kwargs.enable_thinking"
default = "true"
best = "Keep on for reasoning tasks with max_tokens 16000; the chat folds the thinking block."
status = "WORKS"
gui = "Sampling tab (basic toggle); preset Reasoning"
check = "response text contains the thinking block"
source = "docs/settings.toml chat_template_kwargs.enable_thinking; preset Reasoning"
settings = ["chat_template_kwargs.enable_thinking"]

[[capability]]
id = "tools"
name = "Tool calls"
enable = "request fields tools, tool_choice (auto, none, required, or a function name); streaming deltas supported"
default = "off unless the request carries tools"
best = "Use `required` or a named function when a call must happen: `tool_choice: auto` does not restrict which tool names the model may call (v0.6.0 known limits)."
status = "WORKS"
gui = "MISSING (the face sends sampling fields only)"
check = "response `tool_calls` shape"
source = "README.md:327-328; docs/CAPABILITIES.md:124; docs/releases/v0.6.0.md"
settings = []

