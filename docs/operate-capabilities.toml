[[capability]]
id = "spec"
name = "Speculative decoding (MTP draft head)"
enable = "BARO_SPEC=1, BARO_SPEC_K (draft tokens per window), BARO_FR (FR-Spec: 62080-row draft head, on when the pack has frdraft.ids)"
default = "on for dense packs, K=2, FR-Spec draft head on (tools/baro adds the FR table to qwen35 packs and exports BARO_FR=1); unconditionally off on MoE"
best = "Keep on with K=2 and BARO_FR=1 (2026-11-16: q4 pack 20-prompt 1.088x, identity 20/20, GPU J/tok -10.6%; q8 serving pack +9.6% tok/s, -9.6% J/tok, acceptance -3.7 pt; k=3 no better than k=2). for dense packs that carry an MTP head: Qwythos-9B 148.89 tok/s spec off vs 150.96 at k=2 (README). The 27B models gain most: 46.03 vs 69 to 70 (OrcaSAQ-2-27B), 39.3 vs 63.6 (Qwen3.8-27B). A K=4 verify window on the MoE q4x engine FAILS (B/A 1.095)."
status = "WORKS"
gui = "Engine tab (BARO_SPEC basic; BARO_SPEC_K advanced); presets Fast, Balanced"
check = "engine log `BARO_FR: True k 62080` (tools/fr-serve-check.sh); GET /health `limits.spec_k`; `timings.path` and tok/s with BARO_SPEC=0 vs 1, same prompt, 20-prompt median"
source = "README.md:246-250; docs/CAPABILITIES.md:28, 404; docs/BASELINE.md FR-Spec section"
settings = ["BARO_SPEC", "BARO_SPEC_K", "BARO_FR"]

[[capability]]
id = "mega"
name = "Persistent megakernel"
enable = "BARO_MEGA=1"
default = "1 on dense, 0 on MoE"
best = "Leave the default. On Mojo 1.2 the K-quant megakernel is slower than the launch path (87.90 vs 98.29 tok/s, cause open): on a K-quant pack under Mojo 1.2 set BARO_MEGA=0."
status = "WORKS"
gui = "Engine tab (basic toggle); presets Fast, Balanced"
check = "tok/s of the same prompt with BARO_MEGA=0 and 1; `timings.path`"
source = "docs/CAPABILITIES.md:418; docs/BASELINE.md; docs/releases/v0.6.0.md (known limits)"
settings = ["BARO_MEGA", "BARO_MEGA_WIN"]

[[capability]]
id = "kvq"
name = "int8 KV cache"
enable = "BARO_KVQ=int8 (dense and MoE; build and engine restart)"
default = "f32"
best = "Use int8 when f32 KV does not fit: 33,280 bytes per token instead of 131,072, a dense 27B loads to 163,840 tokens, RULER niah_single 100.0 at 64k and 128k, agreement with f32 99.1% mean and 96.9% worst over 20 prompts. The state handoff needs f32 KV."
status = "OFF"
gui = "Engine tab (BARO_KVQ basic); presets Low VRAM, Long context. CAUTION: BARO_KVQ is a build flag (-D); the Apply path passes it as an env variable and tools/baro turns only a profile [build] section into -D flags (tools/baro:153-181, static read, not run): read GET /props after Apply before believing it took effect"
check = "no endpoint shows the KV type (README.md:315 says /props does; serve/src/main.rs:506-519 returns only n_ctx and model): compare `pack-fit PACK --tmax N` and the memory used"
source = "docs/CAPABILITIES.md int8 KV row; docs/models/orcasaq-2-27b.md; bench/min16k.sh"
settings = ["BARO_KVQ"]

[[capability]]
id = "tmax"
name = "Context window"
enable = "BARO_TMAX (engine restart). Dense models (llama, qwen2, granite): tools/baro serve rebuilds the engine once per value (about 35 s, own cache slot); the bare dense engine ignores it. Check /health limits.tmax"
default = "16384 in the face and tools/baro; baro-serve 32768; the bare engine 1088"
best = "Never below 16384. Prefill is quadratic in the prompt (Qwen2.5-7B q4_K_M: 14.8k tokens 39 s, 61k tokens 617 s), so a 98304 window is cheap to hold (19.9 GB VRAM) and expensive to fill. Size it against FREE VRAM, measured (`rocm-smi --showmeminfo vram`, then `pack-fit PACK --tmax N --used-gb X`); the desktop and other GPU programs count."
status = "WORKS"
gui = "Engine tab (BARO_TMAX basic); Apply shows the pack-fit verdict and blocks on NO"
check = "GET /health `limits.tmax` (and /props `default_generation_settings.n_ctx`); `pack-fit`"
source = "README.md:405-408; face/apply.mojo; bench/min16k.sh"
settings = ["BARO_TMAX", "BARO_PACK"]

[[capability]]
id = "prefill"
name = "Batched prefill"
enable = "BARO_PREFILL=1, BARO_PREFILL_C (rows per chunk, 16 to 1024)"
default = "on, 1024"
best = "Leave the default. Q4_K_M prefill of 1,024 tokens takes 0.259 s against llama.cpp's 0.298 s, 16,384 tokens 4.54 s against 5.66 s (Mojo 1.1)."
status = "WORKS"
gui = "Engine tab (BARO_PREFILL basic; BARO_PREFILL_C advanced)"
check = "time to first token on a long prompt"
source = "README.md:178, 203"
settings = ["BARO_PREFILL", "BARO_PREFILL_C", "BARO_PREFILL_ROWS"]

[[capability]]
id = "parallel"
name = "Many sessions on one engine"
enable = "build the engine with -D BARO_SEQ_CAP=N -D BARO_SLOTS=2, then `baro-serve --engine E --pack KQPACK --parallel N --kv-pool P [--max-inflight Q]` (flags, not env; tools/baro serve does not pass them)"
default = "off: one request decodes at a time and the rest queue"
best = "Use for many short independent sessions on a dense K-quant pack: at 32 sessions 112.5 tok/s in total against 65.9 for the serial server and 42.5 for llama-server --parallel 32. One session alone is slower than llama-server (61.3 vs 70.6 tok/s). Past the KV pool the server answers HTTP 429, not a failure."
status = "WORKS"
gui = "MISSING (flags only; the Apply path cannot set them)"
check = "burst of N concurrent requests: 200s and 429s, no 5xx; GET /health `limits.seqs`, `pool`, `capacity`"
source = "docs/design/multi-session-serve.md; docs/plan-ailab-server.md; docs/releases/v0.6.0.md; README.md:337-340"
settings = ["BARO_SEQ_CAP", "BARO_SLOTS", "BARO_KV_POOL", "BARO_SEQS", "BARO_POOL"]

[[capability]]
id = "tier"
name = "Expert tier (MoE in host RAM)"
enable = "BARO_TIER=N (experts cached per layer in VRAM), BARO_TIER_PINNED=1, BARO_TIER_ZC=1"
default = "off"
best = "Only when a MoE pack does not fit: 64 cached experts per layer = 5.2 GB. Zero-copy tier is default-off and needs pinning. The resident qwen35moe pack (21 GB) fits next to a ~1 GB desktop (129.8 tok/s); check with `pack-fit` first."
status = "PARTIAL"
gui = "Engine tab (BARO_TIER basic)"
check = "`pack-fit PACK --tmax N --tier CAP --used-gb X`; GET /health `limits.tier`; tok/s"
source = "docs/CAPABILITIES.md:109, 442; docs/BASELINE.md"
settings = ["BARO_TIER", "BARO_TIER_PINNED", "BARO_TIER_ZC", "BARO_PF_OVERLAP", "BARO_PF_MIN_TIER"]

[[capability]]
