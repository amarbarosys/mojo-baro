status = "OFF"
gui = "MISSING (build flag)"
check = "`bench/check-shared-math.sh`"
source = "docs/CAPABILITIES.md:17"
settings = []

# Command-line flags. setting = the docs/settings.toml key that does the same job ("" = none); gui = control or MISSING.
[[flag]]
tool = "baro-serve"
flag = "--engine PATH"
meaning = "engine binary to run"
setting = ""
gui = "MISSING (tools/baro serve picks the engine)"
[[flag]]
tool = "baro-serve"
flag = "--pack DIR"
meaning = "weight pack directory"
setting = "BARO_PACK"
gui = "Model tab (pack path)"
[[flag]]
tool = "baro-serve"
flag = "--tokenizer FILE"
meaning = "tokenizer.json for the server's own tokenizer"
setting = ""
gui = "MISSING"
[[flag]]
tool = "baro-serve"
flag = "--chat-template-file PATH"
meaning = "override the model's chat template"
setting = ""
gui = "MISSING"
[[flag]]
tool = "baro-serve"
flag = "--host H"
meaning = "listen address (default 127.0.0.1)"
setting = ""
gui = "MISSING (the face connects to the host it was given)"
[[flag]]
tool = "baro-serve"
flag = "--port N"
meaning = "listen port (default 8080)"
setting = ""
gui = "Model tab / `tools/baro gui --port`"
[[flag]]
tool = "baro-serve"
flag = "--audio-only"
meaning = "serve only the audio routes"
setting = ""
gui = "MISSING"
[[flag]]
tool = "baro-serve"
flag = "--embed-only"
meaning = "serve only /v1/embeddings (CPU)"
setting = ""
gui = "MISSING"
[[flag]]
tool = "baro-serve"
flag = "--parallel N"
meaning = "sessions decoding together on one engine (needs an engine built with BARO_SEQ_CAP >= N)"
setting = ""
gui = "MISSING"
[[flag]]
tool = "baro-serve"
flag = "--max-inflight Q"
meaning = "requests admitted at once before HTTP 429"
setting = ""
gui = "MISSING"
[[flag]]
tool = "baro-serve"
flag = "--kv-pool P"
meaning = "KV pool size in sequences"
setting = "BARO_KV_POOL"
gui = "Engine tab, Advanced (BARO_KV_POOL)"
[[flag]]
tool = "baro-serve"
flag = "--warm, --warm-tools FILE, --warm-save FILE"
meaning = "warm the prefix cache at start (with a tools file; save the warmed state)"
setting = ""
gui = "MISSING"
[[flag]]
tool = "baro-serve"
flag = "--engine-env KEY=VALUE"
meaning = "pass an environment variable to the engine (repeatable)"
setting = "any env key"
gui = "Engine tab (staged keys; Apply passes them through tools/baro serve)"
[[flag]]
tool = "tools/baro"
flag = "serve MODEL.gguf [--port N] [--chat-template-file PATH] [--rebuild] [--profile NAME]"
meaning = "build or fetch the engine and pack for a GGUF, then serve"
setting = ""
gui = "Apply restarts the front through exactly this command (face/apply.mojo restart_cmd)"
[[flag]]
tool = "tools/baro"
flag = "run MODEL.gguf [--port N] [--pack DIR] [--work DIR] [--no-serve]"
meaning = "one-shot run"
setting = ""
gui = "MISSING"
[[flag]]
tool = "tools/baro"
flag = "verify, receipts, eval, chat, swarm"
meaning = "gates and clients (see `tools/baro` header)"
setting = ""
gui = "MISSING (CLI only)"
[[flag]]
tool = "tools/baro"
flag = "multi-serve MODEL.gguf [--devices 0,1] [--port N] [--engine-port-base N] [--chat-template-file PATH]"
meaning = "one pinned node per GPU behind baro-router"
setting = ""
gui = "MISSING"
[[flag]]
tool = "tools/baro"
flag = "gui [--model M.gguf] [--port N] [--fps N] [--shots DIR]"
meaning = "open the face"
setting = ""
gui = "is the GUI"
