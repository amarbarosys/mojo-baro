group = "state"

[settings.BARO_STATE_LOAD]
kind = "env"
type = "path"
default = ""
doc = "Restore KV and SSM state from this file before the request (f32 KV only)."
models = ["qwen35", "qwen35moe"]
group = "state"

[settings.BARO_STATE_INT8]
