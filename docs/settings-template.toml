# Every setting mojo-baro reads, one table each. Checked against the source by
# tools/settings-check.py (exit 0 = the template lists exactly what the code reads).
#
# kind:    env        read by an engine binary at run time (getenv)
#          build      a comptime flag, set with -D NAME=VALUE when building
#          server-env read by baro-serve (Rust) at start
#          external   read by the MAX runtime, not by mojo-baro source; profiles may
#                     set it under [env] (tools/settings-check.py does not look for it)
# type:    int | float | bool | string | path   (bool = "1" on, anything else off)
# models:  qwen35 (dense engine.mojo), qwen35moe (MoE engine.mojo), spark
#          (serve/spark.mojo), all, or test (a kernel test/bench binary only)
# group:   serving | memory | speed | speculation | tier | state | debug | test | build
# Profiles (profiles/*.toml) set any subset of these; unset = the default here.

# ---------------------------------------------------------------- build flags

[settings.BARO_CPU]
kind = "build"
type = "bool"
default = "0"
doc = "Build engine for CPU host SIMD execution path without requiring a discrete AMD GPU (-D BARO_CPU=1)."
models = ["spark"]
group = "build"

[settings.BARO_MODEL]
kind = "build"
type = "string"
default = "qwen35"
doc = "Model family the engine is compiled for: qwen35 (dense) or qwen35moe."
models = ["qwen35", "qwen35moe"]
group = "build"

[settings.BARO_SEQ_CAP]
kind = "build"
type = "int"
default = "4"
doc = "Concurrent sequences the KV pool is sized for; each costs a full BARO_TMAX of KV, so single-user long context builds with 1."
models = ["qwen35", "qwen35moe"]
group = "build"

[settings.BARO_KQ_D]
kind = "build"
type = "int"
default = "2"
doc = "Superblock depth in flight per lane in the megakernel K-quant row dot (kernels/gemv_kq.mojo kq_lane_part_ld). 2 is the register-budget optimum on gfx1100 (d1 84.0, d2 95.4, d3 90.2 tok/s)."
models = ["qwen35"]
group = "build"

[settings.BARO_DOT_UNROLL]
kind = "build"
type = "int"
default = "1"
doc = "Unroll of the megakernel q4 dot loop (kernels/mega.mojo). The OrcaSAQ-27B bake builds with 2."
models = ["qwen35", "qwen35moe"]
group = "build"

[settings.BARO_IMG_CAP]
kind = "build"
type = "int"
default = "4096"
doc = "Rows of the image-embedding buffer (serve/registry.mojo): vision tokens one request can carry."
models = ["qwen35moe"]
group = "build"

[settings.BARO_SLOTS]
kind = "build"
type = "int"
default = "9"
doc = "SSM state rollback ring capacity. Minimum kcfg + 2 slots required for MTP draft window of length kcfg; defaults to KMAX + 1 (9)."
models = ["qwen35", "qwen35moe"]
group = "build"


[settings.BARO_H]
kind = "build"
type = "int"
default = "2048"
doc = "qwen35moe shape: hidden size (embedding_length). tools/model-id.py reads it from the GGUF and tools/baro passes it as -D only when it differs from the default (RegesCore-1.0-35B)."
models = ["qwen35moe"]
group = "build"

[settings.BARO_N_LAYERS]
kind = "build"
type = "int"
default = "40"
doc = "qwen35moe shape: layer count (block_count). tools/model-id.py reads it from the GGUF and tools/baro passes it as -D only when it differs from the default (RegesCore-1.0-35B)."
models = ["qwen35moe"]
group = "build"

[settings.BARO_ATT_EVERY]
kind = "build"
type = "int"
default = "4"
doc = "qwen35moe shape: one full-attention layer every N (full_attention_interval); the rest are DeltaNet. tools/model-id.py reads it from the GGUF and tools/baro passes it as -D only when it differs from the default (RegesCore-1.0-35B)."
models = ["qwen35moe"]
group = "build"

[settings.BARO_NQH]
kind = "build"
type = "int"
default = "16"
doc = "qwen35moe shape: attention query heads. tools/model-id.py reads it from the GGUF and tools/baro passes it as -D only when it differs from the default (RegesCore-1.0-35B)."
models = ["qwen35moe"]
group = "build"

[settings.BARO_NKVH]
kind = "build"
type = "int"
default = "2"
doc = "qwen35moe shape: attention KV heads. tools/model-id.py reads it from the GGUF and tools/baro passes it as -D only when it differs from the default (RegesCore-1.0-35B)."
models = ["qwen35moe"]
group = "build"

[settings.BARO_HD]
kind = "build"
type = "int"
default = "256"
doc = "qwen35moe shape: attention head dim (key_length). tools/model-id.py reads it from the GGUF and tools/baro passes it as -D only when it differs from the default (RegesCore-1.0-35B)."
models = ["qwen35moe"]
group = "build"

[settings.BARO_NROT]
kind = "build"
type = "int"
default = "64"
doc = "qwen35moe shape: rotary dims (rope.dimension_count). tools/model-id.py reads it from the GGUF and tools/baro passes it as -D only when it differs from the default (RegesCore-1.0-35B)."
models = ["qwen35moe"]
group = "build"

[settings.BARO_N_EXP]
kind = "build"
type = "int"
default = "256"
doc = "qwen35moe shape: routed experts per layer (expert_count). tools/model-id.py reads it from the GGUF and tools/baro passes it as -D only when it differs from the default (RegesCore-1.0-35B)."
models = ["qwen35moe"]
group = "build"

[settings.BARO_TOPK]
kind = "build"
type = "int"
default = "8"
doc = "qwen35moe shape: experts selected per token (expert_used_count); also the routing-trace width. tools/model-id.py reads it from the GGUF and tools/baro passes it as -D only when it differs from the default (RegesCore-1.0-35B)."
models = ["qwen35moe"]
group = "build"

[settings.BARO_E_FFN]
kind = "build"
type = "int"
default = "512"
doc = "qwen35moe shape: routed expert FFN width (expert_feed_forward_length). tools/model-id.py reads it from the GGUF and tools/baro passes it as -D only when it differs from the default (RegesCore-1.0-35B)."
models = ["qwen35moe"]
group = "build"

[settings.BARO_SH_FFN]
kind = "build"
type = "int"
default = "512"
doc = "qwen35moe shape: shared expert FFN width. tools/model-id.py reads it from the GGUF and tools/baro passes it as -D only when it differs from the default (RegesCore-1.0-35B)."
models = ["qwen35moe"]
group = "build"

[settings.BARO_SSM_NH_K]
kind = "build"
type = "int"
default = "16"
doc = "qwen35moe shape: DeltaNet key heads (ssm.group_count). tools/model-id.py reads it from the GGUF and tools/baro passes it as -D only when it differs from the default (RegesCore-1.0-35B)."
models = ["qwen35moe"]
group = "build"

[settings.BARO_SSM_NH_V]
kind = "build"
type = "int"
default = "32"
doc = "qwen35moe shape: DeltaNet value heads (ssm.time_step_rank). tools/model-id.py reads it from the GGUF and tools/baro passes it as -D only when it differs from the default (RegesCore-1.0-35B)."
models = ["qwen35moe"]
group = "build"

[settings.BARO_SSM_STATE]
kind = "build"
type = "int"
default = "128"
doc = "qwen35moe shape: DeltaNet state size per head (ssm.state_size). tools/model-id.py reads it from the GGUF and tools/baro passes it as -D only when it differs from the default (RegesCore-1.0-35B)."
models = ["qwen35moe"]
group = "build"

[settings.BARO_VOCAB]
kind = "build"
type = "int"
default = "248320"
doc = "qwen35moe shape: vocabulary rows. tools/model-id.py reads it from the GGUF and tools/baro passes it as -D only when it differs from the default (RegesCore-1.0-35B)."
models = ["qwen35moe"]
group = "build"
[settings.BARO_KVQ]
kind = "build"
type = "string"
default = "f32"
doc = "KV cache dtype: f32, or int8 (dense only; RULER 100.0 at 64k and 128k; state files become BAROST03 = pool pages, 32k load 0.061 s, P7-int8-pool-state-2026-09-24; fork ids equal to f32 in the six state-timing cells, 20-prompt gate P7b)."
models = ["qwen35"]
group = "build"

[settings.BARO_MOE_G]
kind = "build"
type = "int"
default = "96"
doc = "Grid size of the persistent MoE token kernel: 96, 192 or 288 (anything else means 96)."
models = ["qwen35moe"]
group = "build"

[settings.BARO_TRACE_SUM]
kind = "build"
type = "int"
default = "0"
doc = "Spark engine: build in per-position residual checksums so two runs can be compared cell by cell."
models = ["spark"]
group = "build"

[settings.BARO_ACT_BF16]
kind = "build"
type = "int"
default = "0"
doc = "Spark engine: 1 builds bf16 GEMV activations (rmsnorm, attention and gate*up outputs), the pre-2026-10-19 numerics; default f32 (-D BARO_ACT_BF16=1)."
models = ["spark"]
group = "build"

[settings.BARO_SP_QKV_S]
kind = "build"
type = "int"
default = "4"
doc = "Spark engine: split-K factor of the QKV GEMV (-D BARO_SP_QKV_S=N); the engine prints it on the 'spark knobs:' line."
models = ["spark"]
group = "build"

[settings.BARO_SP_O_S]
kind = "build"
type = "int"
default = "1"
doc = "Spark engine: split-K factor of the attention output GEMV (-D BARO_SP_O_S=N); the engine prints it on the 'spark knobs:' line."
models = ["spark"]
group = "build"

[settings.BARO_SP_DOWN_S]
kind = "build"
type = "int"
default = "1"
doc = "Spark engine: split-K factor of the ffn_down GEMV (-D BARO_SP_DOWN_S=N); the engine prints it on the 'spark knobs:' line."
models = ["spark"]
group = "build"

[settings.BARO_SP_HEAD_S]
kind = "build"
type = "int"
default = "1"
doc = "Spark engine: split-K factor of the LM head GEMV (-D BARO_SP_HEAD_S=N); the engine prints it on the 'spark knobs:' line."
models = ["spark"]
group = "build"

# ---------------------------------------------------------------- serving

[settings.BARO_PACK]
kind = "env"
type = "path"
default = ".work/moe-w1/pack"
doc = "Weight pack directory the engine loads (pack.bin + index.txt, experts.bin for a tier pack)."
models = ["all"]
group = "serving"

[settings.BARO_SERVE]


kind = "env"
type = "bool"
default = "0"
doc = "Serve mode: read JSON requests on stdin and stream tokens; set by baro-serve for its engines."
models = ["qwen35", "qwen35moe"]
group = "serving"

[settings.BARO_TMAX]
kind = "env"
type = "int"
default = "1088"
doc = "Context length the KV pool is sized for, in tokens (MoE f32 KV costs 40,960 bytes per token per sequence)."
models = ["qwen35", "qwen35moe"]
group = "memory"

[settings.BARO_TUNE]
kind = "env"
type = "bool"
default = "1"
doc = "Read the pack's tune.txt prefill tile table at boot (bench/tile-tune-protocol.md); 0 forces the registry rule. No tune.txt means the rule either way."
models = ["qwen35", "qwen35moe"]
group = "speed"

[settings.BARO_POOL]
kind = "server-env"
type = "int"
default = "1"
doc = "Number of engine processes baro-serve spawns; more than 1 does not fit one 24 GB GPU."
models = ["all"]
group = "serving"

[settings.BARO_RUNTIME]
kind = "server-env"
type = "string"
default = ""
doc = "Runtime identity string hashed into checkpoint ids when the pack has no identity.json; unset falls back to the git commit."
models = ["all"]
group = "serving"

[settings.BARO_PROMPT]
kind = "env"
type = "path"
default = "<pack>/prompt-tokens.txt"
doc = "One-shot mode: token-id file to decode from when not serving."
models = ["qwen35", "qwen35moe"]
group = "serving"

[settings.BARO_CHAT]
kind = "env"
type = "path"
default = ""
doc = "Spark engine: chat JSON file to render with the model's template and decode."
models = ["spark"]
group = "serving"

[settings.BARO_GGUF]
kind = "env"
type = "path"
default = ""
doc = "Spark engine: GGUF to read the tokenizer and chat template from."
models = ["spark"]
group = "serving"

[settings.BARO_GEN]
kind = "env"
type = "int"
default = "64"
doc = "Spark engine: tokens to generate in one-shot mode."
models = ["spark"]
group = "serving"

[settings.BARO_PROMPT_TEXT]
kind = "env"
type = "path"
default = ""
doc = "Spark engine: plain-text prompt file to tokenize and decode."
models = ["spark"]
group = "serving"

# ---------------------------------------------------------------- speed paths

[settings.BARO_ROPE_FUSE]
kind = "env"
type = "bool"
default = "1"
doc = "spark decode: q rope and k rope + KV append in one launch (amar_rope_qkv), byte-equal to the two-launch path (kernels/test_rope_qkv.mojo). Llama 1B g64 1.028x, g256 1.025x, faster on 21/21."
models = ["spark"]
group = "speed"

[settings.BARO_PREFILL_ROWS]
kind = "env"
type = "bool"
default = "1"
doc = "spark batched prompt prefill: rows 0..n-3 in 128-row chunks (dequant + WMMA GEMM), the last two token-by-token. Llama 1B 217 rows 329 -> 26 ms. 0 = token-by-token prefill and no prefill arena (50.9 MB Llama 1B, 173.9 MB Qwen2.5-7B)."
models = ["spark"]
group = "speed"

[settings.BARO_MEGA]
kind = "env"
type = "bool"
default = "1 on dense, 0 on qwen35moe"
doc = "Persistent megakernel: one launch per token. On MoE 113.94 vs 110.90 tok/s, opt-in; refuses BARO_TIER and BARO_EXPERTS."
models = ["qwen35", "qwen35moe"]
group = "speed"

[settings.BARO_MEGA_WIN]
kind = "env"
type = "bool"
default = "0"
doc = "Run the speculative verify window through the megakernel instead of the launch path."
models = ["qwen35"]
group = "speed"

[settings.BARO_TURBO]
kind = "build"
type = "bool"
default = "0"
doc = "Window-path Q4_0 GEMVs (m <= 4) through amar_turbo_rows, the A rows staged once per block in LDS; same words as the q4rowb path, 1.124x on the 27B Turbo spec path. Build flag -D BARO_TURBO=1, read back as BARO_TURBO:."
models = ["qwen35"]
group = "speed"

[settings.BARO_PREFILL]
kind = "env"
type = "bool"
default = "1"
doc = "Batched prefill (up to BARO_PREFILL_C rows per chunk). Default 1 on every profile since 2026-09-24 (qwen35moe was opt-in before); 0 replays the prompt rows one at a time."
models = ["qwen35", "qwen35moe"]
group = "speed"

[settings.BARO_PF_ATT]
kind = "env"
type = "string"
default = "exact"
doc = "qwen35moe batched prefill attention: exact (decode kernel over rows, identical to replay) or wmma (faster at long context, fails the identity and agreement gates)."
models = ["qwen35moe"]
group = "speed"

[settings.BARO_PF_SSM]
kind = "env"
type = "string"
default = "exact"
doc = "qwen35moe batched prefill delta scan: exact (decode summation order) or chunk (dense chunk scan, flips greedy tokens)."
models = ["qwen35moe"]
group = "speed"

[settings.BARO_PF_OVERLAP]
kind = "env"
type = "bool"
default = "1"
doc = "qwen35moe batched prefill with the expert tier: copy the next layer's experts on a second stream while the current layer computes (two staging slots, about 1 GB VRAM). 0 keeps one stream."
models = ["qwen35moe"]
group = "memory"

[settings.BARO_PREFILL_C]
kind = "env"
type = "int"
default = "1024"
doc = "Prefill chunk size in rows, capped at the compiled CP (1024), floor 16."
models = ["qwen35"]
group = "speed"

[settings.MODULAR_DEVICE_CONTEXT_MEMORY_MANAGER_SIZE_PERCENT]
kind = "external"
type = "int"
default = "2"
doc = "MAX's device memory pool, as a percent of free VRAM, reserved up front when the engine starts. Default 2 reserves ~0.45 GB and larger buffers are allocated beside the pool (docs/BASELINE.md, exchange/regescore-blender-ab.md). The engine echoes it."
models = ["all"]
group = "memory"

[settings.BARO_PF_MIN_TIER]
kind = "env"
type = "int"
default = "96"
doc = "With BARO_TIER set, a prompt replay shorter than this many rows runs one token at a time through the VRAM expert cache instead of a batched chunk that stages all 256 experts per layer from host (~1.2 s whatever the rows)."
models = ["qwen35moe"]
group = "tier"

[settings.BARO_ATT_SPLIT]
kind = "env"
type = "bool"
default = "0"
doc = "Force split-K decode attention at every context length (sets the threshold to 0)."
models = ["qwen35", "qwen35moe", "spark"]
group = "speed"

[settings.BARO_ATT_SPLIT_T]
kind = "env"
type = "int"
default = "1088 (spark: 128)"
doc = "Context length above which decode attention switches to split-K. spark: split over (q head, span) blocks plus a merge from 128 tokens (sweep 64/128/192); Llama 1B 4K context 159 -> 424 tok/s, g256 1.029x, g64 neutral, ids 21/21; TMAX or more turns it off."
models = ["qwen35", "qwen35moe", "spark"]
group = "speed"

[settings.BARO_DOT]
kind = "env"
type = "bool"
default = "0"
doc = "int8-dot FFN path on a non-q4 pack; default off."
models = ["qwen35"]
group = "speed"

[settings.BARO_KVTAB]
kind = "env"
type = "string"
default = "identity"
doc = "KV page-table arm, identity or reverse; a gate falsifier, not a user setting."
models = ["qwen35", "qwen35moe"]
group = "debug"

# ---------------------------------------------------------------- speculation

[settings.BARO_SPEC]
kind = "env"
type = "bool"
default = "1"
doc = "Speculative decoding with the model's MTP draft head (dense; 1.1042x on the 20-prompt median)."
models = ["qwen35"]
group = "speculation"

[settings.BARO_SPEC_K]
kind = "env"
type = "int"
default = "2"
doc = "Draft tokens per speculative window, 1 to KMAX."
models = ["qwen35", "qwen35moe"]
group = "speculation"

[settings.BARO_SPEC_DBG]
kind = "env"
type = "bool"
default = "0"
doc = "Print one line per speculative window (position, rows, accepted)."
models = ["qwen35", "qwen35moe"]
group = "debug"

[settings.BARO_DRAFT_Q4]
kind = "env"
type = "bool"
default = "0"
doc = "Use the pack's q4 copy of the draft head, when the pack has one."
models = ["qwen35"]
group = "speculation"

[settings.BARO_FR]
kind = "env"
type = "bool"
default = "0"
doc = "Use the pack's frequency-restricted draft vocabulary, when the pack has one."
models = ["qwen35"]
group = "speculation"

[settings.BARO_NGRAM]
kind = "env"
type = "bool"
default = "0"
doc = "Prompt-lookup (ngram) speculation on MoE, greedy only; measured 0.76x ungated, 1.00x with BARO_NGRAM_MIN=5."
models = ["qwen35moe"]
group = "speculation"

[settings.BARO_NGRAM_MIN]
kind = "env"
type = "int"
default = "1"
doc = "Shortest suffix match that may draft; 3 gave 0.99x, 5 gave 1.00x."
models = ["qwen35moe"]
group = "speculation"

# ---------------------------------------------------------------- expert tier (MoE experts in host RAM)

[settings.BARO_TIER]
kind = "env"
type = "int"
default = ""
doc = "Experts in host RAM with this many cached per layer in VRAM (64 = 5.2 GB); needs a split pack (tools/pack-split-experts.py)."
models = ["qwen35moe"]
group = "tier"

[settings.BARO_TIER_PINNED]
kind = "env"
type = "bool"
default = "1"
doc = "Keep the host expert store in pinned memory (67.12 vs 48.57 tok/s page-cached)."
models = ["qwen35moe"]
group = "tier"

[settings.BARO_TIER_MMAP]
kind = "env"
type = "bool"
default = "1"
doc = "With BARO_TIER_PINNED, mmap experts.bin read-only and hipHostRegister it instead of reading it into a pinned buffer: one RAM copy of the experts, not a pinned copy plus the page cache. 0 = pinned buffer filled by 8 parallel preads."
models = ["qwen35moe"]
group = "tier"

[settings.BARO_TIER_ZC]
kind = "env"
type = "bool"
default = "1"
doc = "Zero-copy misses: expert kernels read missed experts straight from pinned host memory (72.02 vs 67.71 tok/s)."
models = ["qwen35moe"]
group = "tier"


[settings.BARO_TIER_CPU]
kind = "env"
type = "bool"
default = "0"
doc = "Tier misses on q4_k layers computed on the CPU (int8 VNNI, serve/expert_cpu.mojo) while the GPU runs hits; q6_k layers keep ZC; needs pinned store. Round 2: 0.806x of the ZC arm, host-bound (bench/moe-tier-cpu-protocol.md)."
models = ["qwen35moe"]
group = "tier"

[settings.BARO_TIER_BELL]
kind = "env"
type = "bool"
default = "1"
doc = "Doorbell decode under ZC (Strata port P2): router ids/weights/x go to the host through coherent pinned memory and a 1-wave kernel waits for the plan; no per-layer synchronize. Round 4: 1.056x the sync path, tokens identical 20/20 (bench/moe-tier-cpu-protocol.md). 0 = prepare() with a sync per layer."
models = ["qwen35moe"]
group = "tier"

[settings.BARO_TIER_BELL_LAG]
kind = "env"
type = "int"
default = "4"
doc = "Doorbell decode: how many MoE layers the host enqueues ahead of the one it answers (0 under BARO_PROFILE). Lags 0-8 measured flat."
models = ["qwen35moe"]
group = "tier"

[settings.BARO_TIER_BYTES]
kind = "env"
type = "bool"
default = "1"
doc = "Expert cache slots sized per layer in bytes (Strata port P3): same VRAM as BARO_TIER x the largest layer, q4_k layers hold 73 instead of 64 at cap 64; hit rate 0.765 -> 0.779, tokens identical. 0 = BARO_TIER slots in every layer."
models = ["qwen35moe"]
group = "tier"

[settings.BARO_TIER_CPU_MAX]
kind = "env"
type = "int"
default = "8"
doc = "With BARO_TIER_CPU=1: at most this many misses per layer go to the CPU, the rest stay on the GPU ZC path (round 3, bench/moe-tier-cpu-protocol.md). 8 = every miss."
models = ["qwen35moe"]
group = "tier"

[settings.BARO_MOE_DOT]
kind = "env"
type = "bool"
default = "1"
doc = "int8 activation rows + f16 scales per 32 for the sdot4 routed expert kernels on qwen35moe (+9.1% resident decode A/B, cf0dc92)."
models = ["qwen35moe"]
group = "speed"

[settings.BARO_TIER_HOT]
kind = "env"
type = "bool"
default = "0"
doc = "Per-request hot store for re-touched experts; only without pinned memory."
models = ["qwen35moe"]
group = "tier"

[settings.BARO_TIER_HOTCAP]
kind = "env"
type = "int"
default = "128"
doc = "Experts per layer the hot store may hold."
models = ["qwen35moe"]
group = "tier"

[settings.BARO_TIER_STAMP]
kind = "env"
type = "bool"
default = "0"
doc = "Print per-layer tier timing (open, readback, lru, pread, copy) after each request."
models = ["qwen35moe"]
group = "debug"

[settings.BARO_TIER_PIN_FILE]
kind = "env"
type = "path"
default = ""
doc = "PIN1 binary file (from gguf-experts sim-cache --pin-out) listing hot (layer, expert) slots to pin in VRAM (up to cap // 2 per layer) across cyclic scans and request resets."
models = ["qwen35moe"]
group = "tier"

[settings.BARO_DRAFT_CACHE_ONLY]
kind = "env"
type = "bool"
default = "0"
doc = "Zero-I/O cache-only routing fallback: skip host pread/DMA for non-resident experts once the layer cache is populated."
models = ["qwen35moe"]
group = "tier"

# ---------------------------------------------------------------- state and checkpoints

[settings.BARO_CKPT]
kind = "env"
type = "int"
default = "8"
doc = "Prefix checkpoints the engine keeps in serve mode, so a repeated prompt prefix skips prefill."
models = ["qwen35", "qwen35moe"]
group = "state"

[settings.BARO_DEFAULT_TOP_K]
kind = "server-env"
type = "int"
default = ""
doc = "baro-serve: top-k for requests that leave it out (llama-server's default: 40 / 0.95 / 0.05). Unset: untruncated."
models = ["qwen35", "qwen35moe"]
group = "sampling"

[settings.BARO_DEFAULT_TOP_P]
kind = "server-env"
type = "float"
default = ""
doc = "baro-serve: top-p for requests that leave it out (llama-server's default: 40 / 0.95 / 0.05). Unset: untruncated."
models = ["qwen35", "qwen35moe"]
group = "sampling"

[settings.BARO_DEFAULT_MIN_P]
kind = "server-env"
type = "float"
default = ""
doc = "baro-serve: min-p for requests that leave it out (llama-server's default: 40 / 0.95 / 0.05). Unset: untruncated."
models = ["qwen35", "qwen35moe"]
group = "sampling"

[settings.BARO_KV_SHARE]
kind = "env"
type = "int"
default = "0"
doc = "KV pool size in sequences (0 = off): prefix checkpoints keep their own KV pages, so two conversations in flight no longer replay over each other. SEQ_CAP=1 builds."
models = ["qwen35", "qwen35moe"]
group = "state"

[settings.BARO_SEQS]
kind = "env"
type = "int"
default = "1"
doc = "Sequences in flight on one engine. 2 on the MoE profile = the pair loop (serve_pair): two requests decode in one R = 2 megakernel launch, prefill exclusive; needs -D BARO_SEQ_CAP=2, BARO_KV_SHARE > 0 and BARO_MEGA=1 (exchange/mega2-report.md). N > 2 on a dense pack = serve_seqs: N slots, decode steps of up to 8 rows (serve/rows.mojo), prefix pages shared; needs -D BARO_SEQ_CAP>=N and BARO_KV_SHARE > 0 (baro-serve --parallel N sets both knobs; docs/design/multi-session-serve.md)."
models = ["qwen35", "qwen35moe"]
group = "serve"

[settings.BARO_KV_POOL]
kind = "env"
type = "int"
default = "0"
doc = "KV pool size in sequences of TMAX, set outright (0 = max(SEQ_CAP, BARO_KV_SHARE)). BARO_SEQS > 2 slots take pages as they decode, so the pool is sized by VRAM; a request whose prompt pages do not fit is refused (kv pool full, HTTP 429). baro-serve --kv-pool P."
models = ["qwen35"]
group = "serve"

[settings.BARO_CKPT_END]
kind = "env"
type = "bool"
default = "1"
doc = "BARO_SEQS > 2: save the prompt-end checkpoint of every request (a CONV+SSM state copy, ~50 MB, reused only by an identical prompt). 0 skips it."
models = ["qwen35"]
group = "serve"

[settings.BARO_SEQS_PF]
kind = "env"
type = "string"
default = "all"
doc = "BARO_SEQS > 2: all = run every pending prefill before the next decode step (full decode batches for lockstep bursts); one = one prefill step per loop."
models = ["qwen35"]
group = "serve"

[settings.BARO_SEQS_RESERVE]
kind = "env"
type = "int"
default = "512"
doc = "BARO_SEQS > 2: decode tokens of KV pages a request must get at admission besides its prompt (capped at its n). While other requests run, a request that cannot get them waits in the engine queue; alone, it is refused (kv pool full, HTTP 429). Pages past the reserve are taken as the slot decodes."
models = ["qwen35"]
group = "serve"

[settings.BARO_SEQS_ROWS]
kind = "env"
type = "bool"
default = "1"
doc = "BARO_SEQS > 2: decode the slots in batched steps of up to 8 rows (serve/rows.mojo step_rows). 0 = one step_window per slot (A/B arm)."
models = ["qwen35"]
group = "serve"

[settings.BARO_ROWS_GEMV]
kind = "env"
type = "bool"
default = "1"
doc = "BARO_SEQS > 2: K-quant GEMMs of a batched step read the weights once for all rows (amar_gemv_kq_rows, byte-equal per row to the m = 1 kernel). 0 = one m = 1 GEMV per row (A/B arm)."
models = ["qwen35"]
group = "serve"

[settings.BARO_SEQS_TIME]
kind = "env"
type = "bool"
default = "0"
doc = "BARO_SEQS > 2: synchronize around prefill and decode steps and print the split plus step ms by row count every 64 loops (instrument; adds host syncs)."
models = ["qwen35"]
group = "serve"

[settings.BARO_PAIR_TRACE]
kind = "env"
type = "bool"
default = "0"
doc = "Pair-loop diagnostics: a synchronized print after every prefill step and the first pair steps of each request, and per-layer / per-kernel prints on the launch path. Diagnosis only, slows every step."
models = ["qwen35moe"]
group = "serve"

[settings.BARO_PF_GEMM]
kind = "env"
type = "str"
default = "wmma"
doc = "Prefill GEMM path for the MoE profile: wmma (grouped experts and q8 projections on WMMA, phase 2) or exact (the bit-exact row kernels, the replay identity arm). Read back as 'BARO_PF_GEMM: <value>'."
models = ["qwen35moe"]
group = "prefill"

[settings.BARO_STATE_KV7]
kind = "env"
type = "bool"
default = "0"
doc = "Write BAROKV7 checkpoints: splits CONV_SLOT + SSM_SLOT into a RLE-compressed sign+exponent high-byte plane and a raw mantissa low-byte plane (~3.1x smaller than f32 BAROST02/03, lossless 16-bit precision)."
models = ["qwen35", "qwen35moe"]
group = "state"

[settings.BARO_LOG_RENDER]
kind = "server-env"
type = "bool"
default = "0"
doc = "Log each chat request's whole rendered prompt (the check that chat_template_kwargs changed it); otherwise only its length is logged."
models = ["all"]
group = "debug"

[settings.BARO_CKPT_API]
kind = "server-env"
type = "int"
default = "8"
doc = "Checkpoints baro-serve's /v1/fork and state API keep on disk."
models = ["all"]
group = "state"

[settings.BARO_CKPT_DIR]
kind = "server-env"
