group = "memory"

[settings.BARO_WEIGHTS_EXPORT]
kind = "env"
type = "path"
default = ""
doc = "T3b step 2: load the pack into an IPC-exportable allocation and write the 112-byte weight record (magic, size, pack salt, handle) here for BARO_WEIGHTS_IMPORT engines; this engine must outlive them."
