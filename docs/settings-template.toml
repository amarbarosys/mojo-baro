group = "state"

[settings.BARO_LATENT_SOCK]
kind = "env"
type = "path"
default = ""
doc = "LatentOS agent socket for state handoff as sealed memfds; set and unreachable raises."
models = ["qwen35", "qwen35moe"]
group = "state"

[settings.BARO_EMBD_HOST]
kind = "env"
type = "bool"
default = "0"
doc = "T3b step 2b: keep token_embd (bf16, the pack's first tensor) in mapped pinned host memory that the embed kernels read in place, saving its 2.03 GB of VRAM on the 9B; the weight record then carries the device bytes only, so both engines of a shared pair must agree. realign's full-table gather reads it over PCIe."
